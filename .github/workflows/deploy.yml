name: Build, check and deploy site

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@e1bd6146574da5e0795075b5319b300edb30c5b0 # v1
        with:
          ruby-version: "3.3.5"
          bundler: "2.6.5"
          bundler-cache: true
      - name: Build the production artifact
        env:
          JEKYLL_ENV: production
          BUNDLE_FROZEN: "true"
        run: bundle exec jekyll build --trace
      - name: Check routes, links, metadata and public content
        run: python3 scripts/check_site.py
      - name: Check screenshot interaction syntax
        run: node --check assets/personal/project.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checked-site
          path: _site/
          retention-days: 30
          if-no-files-found: error

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: checked-site
          path: _site/
      - name: Deploy the checked artifact to the existing Pages branch
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          folder: _site
          branch: gh-pages
          clean: true
