title: Lucas Han
author: Lucas Han
email: lucashan1225@gmail.com
description: >-
  Computer Science and Philosophy at Oxford. Projects in personal AI tools,
  robot coverage planning, and physics-driven games; writing on philosophy and AI.
url: https://haojunhan.com
baseurl: ""
lang: en
timezone: Europe/London
encoding: utf-8
permalink: /blog/:year/:title/
strict_front_matter: true
future: false
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
collections:
  projects:
    output: true
    permalink: /projects/:name/
defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: personal-project
      section: projects
  - scope:
      path: ""
      type: posts
    values:
      layout: personal-post
      section: writing
plugins:
  - jekyll-feed
  - jekyll-sitemap
feed:
  posts_limit: 20
include:
  - _pages
exclude:
  - _archive
  - _preview
  - scripts
  - vendor
  - .bundle
  - .github
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - .ruby-version
  - .gitignore
  - .gitattributes
  - .git-blame-ignore-revs
